name: Update data

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours
  workflow_dispatch:
    inputs:
      max_gecko_calls:
        description: GeckoTerminal call budget (raise for the first backfill)
        default: '300'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch data
        run: node scripts/update.mjs
        env:
          BITQUERY_TOKEN: ${{ secrets.BITQUERY_TOKEN }}
          BITQUERY_DATASET: ${{ vars.BITQUERY_DATASET || 'realtime' }}
          BACKFILL_DAYS: ${{ vars.BACKFILL_DAYS || '0' }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          MAX_GECKO_CALLS: ${{ inputs.max_gecko_calls || '300' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json public/data.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
